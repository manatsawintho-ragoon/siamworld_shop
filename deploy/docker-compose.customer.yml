# ============================================================
#  Siamsite Shop — Per-Customer Production Stack
#  Usage: managed by new-customer.sh (Linux) / new-customer.ps1 (Windows)
#  Do NOT edit manually — use the deploy script
#
#  NOTE: MYSQL_ROOT_HOST "%" is intentional — AuthMe plugin on the
#  customer's Minecraft server connects to this MySQL from outside.
#  Port is exposed per-customer (MYSQL_EXPOSED_PORT) and protected
#  by UFW firewall rules on the VPS host.
# ============================================================

# Container stdout/stderr is capped here rather than in /etc/docker/daemon.json,
# because daemon-level log-opts only take effect for containers created after a
# full dockerd restart - which would bounce every customer at once. Declared
# per-service, a shop picks the cap up on its next recreate, so the fleet
# converges with no coordinated downtime.
#
# Do NOT cap these with logrotate instead: truncating a live json.log out from
# under the daemon desyncs its log reader, and `docker logs` (and therefore the
# panel's log viewer) hangs forever until the container is restarted.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    command: >
      --max_connections=30
      --wait_timeout=1800
      --interactive_timeout=1800
      --log-bin=mysql-bin
      --server-id=${MYSQL_EXPOSED_PORT}
      --binlog-format=ROW
      --binlog-expire-logs-seconds=604800
      --relay-log=relay-bin
      --replicate-do-table=${MYSQL_DATABASE}.authme
      --gtid-mode=ON
      --enforce-gtid-consistency=ON
      --performance-schema=OFF
      --innodb-buffer-pool-size=96M
      --table-open-cache=512
      --table-definition-cache=512
      --innodb-log-buffer-size=8M
      --skip-name-resolve
      --innodb-redo-log-capacity=32M
      --innodb-temp-data-file-path=ibtmp1:12M:autoextend:max:256M
    mem_limit: 512m
    environment:
      # Falls back to MYSQL_PASSWORD so every existing shop keeps its current
      # root password (MYSQL_ROOT_PASSWORD only takes effect on first init, so
      # this cannot change an already-provisioned volume). New shops should set
      # a distinct value: the app authenticates as MYSQL_USER/MYSQL_PASSWORD, and
      # sharing that with root means one leaked credential is two.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD}}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-siamsite}
      MYSQL_USER: ${MYSQL_USER:-siamsite}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_HOST: "%"
    ports:
      - "${MYSQL_EXPOSED_PORT}:3306"   # AuthMe plugin connects here from Minecraft server
    volumes:
      - mysql_data:/var/lib/mysql
      - ${HOST_SOURCE_ROOT}/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-${MYSQL_PASSWORD}}"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - internal

  backend:
    build:
      context: ${SOURCE_ROOT}/backend
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    logging: *default-logging
    # Cap per-tenant RAM so one shop can't starve its neighbours on the shared
    # VPS. Idle usage is ~30MB; 512m is generous headroom, not a reservation.
    mem_limit: 512m
    env_file: ${CUSTOMER_ENV_FILE}
    environment:
      MYSQL_HOST: mysql
      REDIS_HOST: redis
      NODE_ENV: production
    # Lets the shop reach panel-backend (host port 5000) for the bridge internal API
    # without round-tripping through Cloudflare → NPM. Faster + no transient `fetch failed`.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  frontend:
    build:
      context: ${SOURCE_ROOT}/frontend
      dockerfile: Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL}
        BACKEND_INTERNAL_URL: http://backend:${BACKEND_PORT}
    restart: unless-stopped
    logging: *default-logging
    mem_limit: 512m
    environment:
      HOSTNAME: "0.0.0.0"
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - internal
    volumes:
      # Next's optimised-image cache, kept outside the container.
      #
      # Shop owners host their artwork wherever they like, and re-encoding a cold
      # image means fetching it from that host and running it through sharp: 2.6s
      # for one file, measured, against 3ms once cached. The cache used to live in
      # the container filesystem, so every `manage-customer.sh rebuild` threw it
      # away and the next visitors re-paid that cost on every image at once.
      # Cloudflare does not absorb it either - /_next/image carries no file
      # extension, so it answers cf-cache-status: DYNAMIC and every request
      # reaches the origin.
      - image_cache:/app/.next/cache/images

volumes:
  mysql_data:
  redis_data:
  image_cache:

networks:
  internal:
    driver: bridge
